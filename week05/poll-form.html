<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/poll-form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
</head>
<body>
    <header>
        <h1>Poll Form</h1>
    </header>
    <main>
        <form>
        <div class="form-item column2">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="form-item" column2>
        <label for="useremail">Email:</label>
        <input type="email" id="useremail" name="useremail" required>
        </div>
        <!-- <label>Full Name: <input type="text" name="fullname" required></label>
        <label>Email: <input type="email" name="useremail" required></label> -->
        <label for="favorite-browser">What is your favorite browser?</label>
        <div class="form-item" column1>
        <select name="favorite-browser" id="favorite-browser">
        <option value="1">Chrome</option>
        <option value="2">Firefox</option>
        <option value="3">Safari</option>
        </select>
        </div>
        <div class="form-item" column1>
        <label for="pet">Do you have a pet?</label>
        <input type="checkbox" id="pet" name="pet">
        <label for="feedback">List the places you have lived:</label>
        <div class="form-item" column-full>
        <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
        </form>
        <button type="submit">Submit Poll</button>
    </main>
</body>
</html>
