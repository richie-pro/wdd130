    <section class="hero-section">

        <div class="trips"></div>

        </div>
            <button type="go-to-trips">Book Your Adventure Now!<br>
            <a href="trips.html">Trips</a>

    <main>
    <section class="home">
        <div class="home-grid">
    <figure>
        <img src="images/adraft.jpg" alt="Widowmaker Gorge">
        <figcaption>
            <h3>Full Day Canyon Expedition</h3>
            <p>Conquer roaring class IV rapids with our certified expert guides.</p>
            <p>Experience 8 hours of heart-pounding thrills through breathtaking canyons.</p>
            <p>Safety gear, professional instruction, and a riverside lunch are included.</p>
        </figcaption>
    </figure>

    <figure>
        <img src="images/thraft.jpg" alt="Lava Falls">
        <figcaption>
            <h3>Family Splash & Float</h3>
            <p>Enjoy a gentler, scenic river journey perfect for all ages and skill levels.</p>
            <p>Spot local wildlife while paddling through calm, crystal-clear water stretches.</p>
            <p>Led by patient guides who prioritize fun, comfort, and safety for everyone.</p>
        </figcaption>
    </figure>

    <figure>
        <img src="images/fun.jpg" alt="Granite Drop">
        <figcaption>
            <h3>Extreme Whiteout Rush</h3>
            <p>Push your limits on the most aggressive, technical rapids on the river.</p>
            <p>Designed for seasoned thrill-seekers looking for an unforgettable adrenaline kick.</p>
            <p>Advanced safety protocols and top-of-the-line gear keep you secure on every drop.</p>
        </figcaption>
    </figure>

        </div>
    </section>
    <section class="form-section">
        <form action="#" method="post">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
    </section>
