<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Experience more about FlowState Rafting and how to get in touch with us for your next adventure!"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us: FlowState Rafting | WHITEOUT ADVENTURES</title>
    <link rel="stylesheet" href="styles/contact.css">
    <meta name="author" content="Richie Mpofu">
  </head>
  <body>
    <header>
      <img
        src="images/company-icon.jpeg"
        alt="FlowState Rafting Logo"
        width="200"
      />
      <nav>
        <ul class="navigation">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </header>
    <main>
    <div class="company-header">
      <h1>FlowState Rafting | WHITEOUT ADVENTURES</h1>
        <address>
          <p>123 River Rd, Canyonville, CA 95923</p>
          <p>Canyonville, California</p>
          <a href="tel:5551234567">(555) 123-4567</a>
          <a href="mailto:info@flowstaterafting.com"
            >info@flowstaterafting.com</a
          >
        </address>
    </div>
    
    <div class="contact-row">
        <section class="map-section">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6043377.06433697!2d-115.99110946937785!3d37.49122033317003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sCalifornia%2C%20USA!5e0!3m2!1sen!2szw!4v1791288188286!5m2!1sen!2szw"
          width="600"
          height="450"
          allowfullscreen=""
          loading="lazy"
          title="Map showing FlowState Rafting location"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
        </section>

        <section class="form-section">
            <form action="#" method="post">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <fieldset>
            <legend>Purpose of Message</legend>

            <label for="general">
              <input
                type="radio"
                id="general"
                name="purpose"
                value="general"
                checked
              />
              General Inquiry
            </label>

            <label for="feedback">
              <input
                type="radio"
                id="feedback"
                name="purpose"
                value="feedback"
              />
              Feedback
            </label>

            <label for="booking">
              <input type="radio" id="booking" name="purpose" value="booking" />
              Booking Request
            </label>
          </fieldset>

          <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <label for="newsletter">Subscribe to our newsletter:</label>
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="newsletter"
            name="newsletter"
            value="yes"
          />
        </div>

          <button type="submit">Send Message</button>
        </form>
        </section>
    </div>

      <section class="team-section">
          <h2>Meet Our Team</h2>
        <div class="team-grid">
        <figure>
          <img src="images/keishareeves.jpg" alt="Keisha Reeves - Lead Guide" />
          <figcaption>Keisha Reeves - Lead Guide</figcaption>
        </figure>

        <figure>
          <img src="images/johntery.webp" alt="John Tery - Safety Officer" />
          <figcaption>John Tery - Safety Officer</figcaption>
        </figure>

        <figure>
          <img
            src="images/lorrainejackson.webp"
            alt="Lorraine Jackson - Customer Relations"
          />
          <figcaption>Lorraine Jackson - Customer Relations</figcaption>
        </figure>
        </div>
      </section>
    </main>
    <footer>
      <p>©2026 FlowState Rafting | All Rights Reserved</p>
      <nav class="socialmedia">
        <a href="https://www.facebook.com">
          <img src="images/facebook-icon.png" alt="Facebook Icon" width="40"
        /></a>
        <a href="https://www.instagram.com">
          <img src="images/instagram-icon.png" alt="Instagram Icon" width="40"
        /></a>
        <a href="https://x.com">
          <img src="images/twitter-icon.png" alt="X icon" width="40"
        /></a>
      </nav>
    </footer>
  </body>
</html>
